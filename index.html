<!DOCTYPE html>
<html lang="en">

    <head>


        <title>Morse Code Translator</title>

        <!-- bootstrap CSS-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <!-- allows for responsive view -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">

        <!--Stylesheets --->
        <link rel="stylesheet" href="style.css">


    </head>


    <body>

        <div id="alertDiv">

        </div>

        <div class="d-flex justify-content-center justify-content-sm-start container-md py-sm-3 title mt-3">MORSE CODE
            TRANSLATOR
        </div>


        <div class="d-flex justify-content-start align-items-center container-md my-3 my-sm-0">
            <div id="textMorse" onclick="translationModeChange(this)"
                class="translatorSelect p-2 px-3 me-1 me-sm-2 selected text-center">TEXT TO MORSE</div>
            <div id="morseText" onclick="translationModeChange(this)"
                class="translatorSelect p-2 px-3 ms-1 me-sm-2 text-center">MORSE TO TEXT</div>
        </div>


        <div class="d-flex flex-column container-md my-sm-4">

            <div class="d-flex-block justify-content-start d-sm-flex">
                <div class="translationBox me-2 me-md-4">
                    <div class="topText m-3" id="ttInput">>> INPUT (TEXT) </div>
                    <textarea class="px-3" name="" id="inputTextBox"></textarea>
                </div>


                <div class="translationBox me-1">
                    <div class="topText m-3" id="ttOutput">>> OUTPUT (MORSE) </div>
                    <div class="px-3" id="outputText">

                    </div>
                </div>
            </div>

        </div>

        <div class="d-flex container-md">
            <div onclick="translateButton();buttonClick(this)" class="translateBtn me-sm-2 me-1 text-center p-2 px-3">
                TRANSLATE</div>

            <div name="copyBtn" onclick="copyButton();buttonClick(this)"
                class="translateBtn me-sm-2 ms-1 text-center p-2 px-3">COPY MORSE</div>
        </div>


    </body>


    <script src="app.js"></script>


    <!-- bootstrap JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>


    <!-- bootstrap poppers (dropdowns,popover etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>


</html>
